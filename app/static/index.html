<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Барная смена</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/admin.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">BAR SHIFT</p><h1 id="greeting">Барная смена</h1></div><span class="status-dot"></span></header>
<nav class="tabs"><button class="tab active" data-page="home">Главная</button><button class="tab" data-page="recipes">Техкарты</button><button class="tab" data-page="shift">Закрытие</button><button class="tab" data-page="schedule">График</button><button class="tab admin-only" data-page="admin">Админка</button></nav>
<section id="home" class="page active"><div class="hero"><span class="hero-icon">🍸</span><div><h2>Смена под контролем</h2><p>Все нужное для работы бара в одном месте.</p></div></div><div class="quick-grid"><button data-page="recipes"><b>Техкарты</b><small>Поиск коктейлей</small></button><button data-page="shift"><b>Закрытие смены</b><small>Отчёт и фото</small></button><button data-page="schedule"><b>Мой график</b><small>Смены и выходные</small></button></div></section>
<section id="recipes" class="page"><div class="section-head"><div><p class="eyebrow">БАЗА БАРА</p><h2>Техкарты</h2></div></div><input id="recipe-search" class="search" placeholder="Поиск по названию или ингредиенту"><div id="recipe-list" class="cards"></div><div id="recipe-detail" class="recipe-detail" hidden></div></section>
<section id="shift" class="page"><p class="eyebrow">КОНЕЦ СМЕНЫ</p><h2>Закрытие смены</h2><form id="shift-form" class="form"><label>Комментарий<textarea name="comment" placeholder="Что важно передать администратору?"></textarea></label><div class="photo-grid"><label class="photo-slot"><span>📷</span><b>Барная станция</b><input name="photos" data-photo-type="bar_station" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Раковина</b><input name="photos" data-photo-type="sink" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Чайная поверхность</b><input name="photos" data-photo-type="tea_surface" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Кофеточка</b><input name="photos" data-photo-type="coffee_station" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Витрина холодильник 1</b><input name="photos" data-photo-type="fridge_1" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Витрина холодильник 2</b><input name="photos" data-photo-type="fridge_2" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Витрина минихолодильник</b><input name="photos" data-photo-type="mini_fridge" type="file" accept="image/*" capture="environment"></label></div><button class="primary" type="submit">Отправить отчёт</button><p id="shift-result" class="result"></p></form></section>
<section id="schedule" class="page"><p class="eyebrow">ПЛАНИРОВАНИЕ</p><h2>Мой график</h2><div id="schedule-list" class="schedule-list"></div><form id="day-off-form" class="inline-form"><input name="request_date" type="date" required><button class="secondary" type="submit">Запросить выходной</button></form><p id="day-off-result" class="result"></p><form id="swap-form" class="form"><h3>Обмен сменой</h3><input name="request_date" type="date" required><select name="target_user_id" id="swap-user" required><option value="">Выберите сотрудника</option></select><textarea name="comment" placeholder="Комментарий"></textarea><button class="secondary" type="submit">Отправить заявку на обмен</button></form><p id="swap-result" class="result"></p></section>
<section id="admin" class="page admin-only"><div class="section-head"><div><p class="eyebrow">УПРАВЛЕНИЕ</p><h2>Админка</h2></div><button class="secondary" id="admin-refresh" type="button">Обновить</button></div><div class="admin-panel"><h3>Заявки на выходные</h3><div id="admin-requests" class="admin-list"></div></div><div class="admin-panel"><h3>Заявки на обмен сменами</h3><div id="admin-swaps" class="admin-list"></div></div><div class="admin-panel"><h3>Составление графика</h3><div class="calendar-toolbar"><button class="mini-button" id="calendar-prev" type="button">‹</button><strong id="calendar-month"></strong><button class="mini-button" id="calendar-next" type="button">›</button></div><div id="admin-calendar" class="admin-calendar"></div><div id="calendar-editor" class="calendar-editor" hidden><b id="calendar-selected-date"></b><div id="calendar-user-list" class="user-checks"></div><button class="primary" id="calendar-save" type="button">Сохранить сотрудников</button></div></div><div class="admin-panel"><div class="section-head"><h3>Техкарты</h3><button class="secondary" id="new-recipe" type="button">Добавить</button></div><div id="admin-recipes" class="admin-list"></div></div><div class="admin-panel"><h3>Отчёты смен</h3><div id="admin-shifts" class="admin-list"></div></div><p id="admin-result" class="result"></p></section></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/app.js"></script></body></html>
