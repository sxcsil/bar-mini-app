<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Барная смена</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">BAR SHIFT</p><h1 id="greeting">Барная смена</h1></div><span class="status-dot"></span></header>
<nav class="tabs"><button class="tab active" data-page="home">Главная</button><button class="tab" data-page="recipes">Техкарты</button><button class="tab" data-page="shift">Закрытие</button><button class="tab" data-page="schedule">График</button></nav>
<section id="home" class="page active"><div class="hero"><span class="hero-icon">🍸</span><div><h2>Смена под контролем</h2><p>Все нужное для работы бара в одном месте.</p></div></div><div class="quick-grid"><button data-page="recipes"><b>Техкарты</b><small>Поиск коктейлей</small></button><button data-page="shift"><b>Закрытие смены</b><small>Отчёт и фото</small></button><button data-page="schedule"><b>Мой график</b><small>Смены и выходные</small></button></div></section>
<section id="recipes" class="page"><div class="section-head"><div><p class="eyebrow">БАЗА БАРА</p><h2>Техкарты</h2></div></div><input id="recipe-search" class="search" placeholder="Поиск по названию или ингредиенту"><div id="recipe-list" class="cards"></div></section>
<section id="shift" class="page"><p class="eyebrow">КОНЕЦ СМЕНЫ</p><h2>Закрытие смены</h2><form id="shift-form" class="form"><label>Наличные<input name="cash_amount" type="number" min="0" step="0.01" placeholder="0"></label><label>Безналичные<input name="card_amount" type="number" min="0" step="0.01" placeholder="0"></label><label>Комментарий<textarea name="comment" placeholder="Что важно передать администратору?"></textarea></label><div class="photo-grid"><label class="photo-slot"><span>📷</span><b>Барная стойка</b><input name="photos" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Холодильник</b><input name="photos" type="file" accept="image/*" capture="environment"></label><label class="photo-slot"><span>📷</span><b>Кассовый отчёт</b><input name="photos" type="file" accept="image/*" capture="environment"></label></div><button class="primary" type="submit">Отправить отчёт</button><p id="shift-result" class="result"></p></form></section>
<section id="schedule" class="page"><p class="eyebrow">ПЛАНИРОВАНИЕ</p><h2>Мой график</h2><div id="schedule-list" class="schedule-list"></div><form id="day-off-form" class="inline-form"><input name="request_date" type="date" required><button class="secondary" type="submit">Запросить выходной</button></form><p id="day-off-result" class="result"></p></section></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/app.js"></script></body></html>
